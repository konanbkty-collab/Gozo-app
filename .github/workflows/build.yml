name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.x'
          channel: 'stable'

      - name: Create full Flutter project structure if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --org com.gozo.livraison --project-name gozo_app --platforms=android
          fi

      - name: Restore custom main.dart and assets
        run: |
          # Le script s'assure que vos fichiers personnalisés priment
          echo "Structure prête pour la compilation"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gozo-livraison-apk
          path: build/app/outputs/flutter-apk/app-release.apk
